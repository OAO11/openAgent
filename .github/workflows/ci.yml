name: openAgent CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
      - name: Install desktop dependencies
        run: npx --yes pnpm@10.32.1 install --frozen-lockfile --filter openagent-workspace --filter liveagent...
      - name: Validate desktop source
        run: |
          npx --yes pnpm@10.32.1 typecheck:ui
          npx --yes pnpm@10.32.1 typecheck:gui
          npx --yes pnpm@10.32.1 check:ui-boundaries
          node scripts/generate-builtin-skills.mjs --check
      - name: Test release tooling
        run: node --test scripts/release/release-version.test.mjs scripts/release/build-kbrain-source.test.mjs scripts/release/prepare-kbrain.test.mjs scripts/release/verify-kbrain-packaging.test.mjs
