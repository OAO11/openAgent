name: openAgent CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
      - name: Install desktop dependencies
        run: npx --yes pnpm@10.32.1 install --frozen-lockfile --filter openagent-workspace --filter liveagent...
      - name: Validate desktop source
        run: |
          npx --yes pnpm@10.32.1 check:source-scope
          if ($LASTEXITCODE -ne 0) { throw 'Desktop validation failed' }
          npx --yes pnpm@10.32.1 typecheck:ui
          if ($LASTEXITCODE -ne 0) { throw 'Desktop validation failed' }
          npx --yes pnpm@10.32.1 typecheck:gui
          if ($LASTEXITCODE -ne 0) { throw 'Desktop validation failed' }
          npx --yes pnpm@10.32.1 check:ui-boundaries
          if ($LASTEXITCODE -ne 0) { throw 'Desktop validation failed' }
          node scripts/generate-builtin-skills.mjs --check
          if ($LASTEXITCODE -ne 0) { throw 'Desktop validation failed' }
      - name: Test release tooling
        run: node --test scripts/release/release-version.test.mjs scripts/release/build-kbrain-source.test.mjs scripts/release/prepare-kbrain.test.mjs scripts/release/verify-kbrain-packaging.test.mjs scripts/release/sync-kbrain-upstream.test.mjs scripts/release/build-kbrain-source-adversarial.test.mjs
      - name: Test subagent lifecycle and memory retention
        run: node --test crates/agent-gui/test/providers/kbrain-subagents.test.mjs crates/agent-gui/test/chat/kbrain-subagent-control.test.mjs
      - name: Test provider controls and model parameters
        run: node --test crates/agent-gui/test/settings/provider-controls.test.mjs crates/agent-gui/test/settings/provider-controls-modal.test.mjs crates/agent-gui/test/settings/provider-model-draft.test.mjs crates/agent-gui/test/providers/kbrain-provider-settings.test.mjs crates/agent-gui/test/chat/model-selection.test.mjs
      - name: Test audited UI regressions
        run: node --test --test-concurrency=2 crates/agent-gui/test/settings/disabled-provider-resources.test.mjs crates/agent-gui/test/ui/touch-targets.test.mjs crates/agent-gui/test/i18n/no-cjk-ui-literals.test.mjs
